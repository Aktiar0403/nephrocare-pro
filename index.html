<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NephroCare Pro — Nephrology visit workspace</title>
  <meta name="description" content="Clinical decision support for nephrology visits: eGFR, KDIGO staging, flagged labs, rule-based suggestions and printable prescriptions.">
  <meta name="theme-color" content="#0b4f5c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3c-3 0-5 3-5 7 0 5 3 11 6 11 2 0 3-2 3-4V7c0-2-1-4-4-4z"/><path d="M16 3c3 0 5 3 5 7 0 5-3 11-6 11-2 0-3-2-3-4V7c0-2 1-4 4-4z"/></svg></span>
        <div>NephroCare Pro<small>Nephrology workspace</small></div>
      </div>
      <div class="patient-strip" id="patient-strip"></div>
      <div class="topbar-actions">
        <button class="btn" id="btn-new" data-action="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>New visit</span></button>
        <button class="btn primary" data-action="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg><span>Save visit</span></button>
      </div>
    </header>
    <nav class="rail" id="rail" aria-label="Visit workflow"></nav>
    <main class="main" id="main"></main>
    <aside class="aside" id="aside" aria-label="Live assessment"></aside>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="print-sheet"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
